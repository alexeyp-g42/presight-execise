services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_PATH: /data/app.db
      SEED_USERS: 50000
      PORT: 4000
    volumes:
      - sqlite_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      # Override with WEB_PORT=8081 docker compose up if 8080 is taken.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      # First boot seeds 50,000 users. Without this gate the SPA would load
      # against an API that is still writing.
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
